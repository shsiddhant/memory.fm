name: Bug report
description: Report a bug.
title: "bug: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Please provide enough detail to help reproduce and diagnose the issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
      placeholder: |
        Example:
        On the Attachment page, Attachment timeline is cut off on some browser widths.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include clear reproduction steps.
      placeholder: |
        1. Open the Attachment page.
        2. Adjust browser width between 768px and 1024px.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Frontend (React/Vite)
        - Backend (FastAPI)
        - Database / Analytics
        - Data import / sync
        - Visualizations
        - CI / tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error messages / logs
      description: Paste exception traces, console errors, if available.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Recordings
      description: |
        Drag and drop screenshots, GIFs, or screen recordings here if applicable.
      placeholder: |
        Paste images or recordings directly into this field.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant environment details.
      placeholder: |
        - OS:
        - Browser:
        - Python version:
        - Node version:
        - Database:
        - Commit/version:
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help diagnose the issue.
